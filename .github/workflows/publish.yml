name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version bump: patch, minor, major, or an explicit semver like 0.2.0"
        required: true
        default: patch
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        working-directory: packages/pi-herdr
        run: bun test

      - name: Bump version
        working-directory: packages/pi-herdr
        run: npm version "${{ inputs.version }}" --git-tag-version=false

      - name: Commit and tag release
        run: |
          VERSION=$(node -p "require('./packages/pi-herdr/package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/pi-herdr/package.json package-lock.json
          git commit -m "chore: release pi-herdr ${VERSION}"
          git tag "v${VERSION}"
          git push origin main --tags

      - name: Create GitHub release
        run: |
          VERSION=$(node -p "require('./packages/pi-herdr/package.json').version")
          gh release create "v${VERSION}" --generate-notes --title "pi-herdr ${VERSION}"

      - name: Publish to npm
        working-directory: packages/pi-herdr
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify publication
        run: npm view "@ret2hell/pi-herdr-orchestrator@$(node -p "require('./packages/pi-herdr/package.json').version")" version
